name: Security - Trivy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TRIVY_UPLOAD_SARIF: ${{ vars.TRIVY_UPLOAD_SARIF || 'false' }}

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  schedule:
    - cron: "0 2 * * *"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      # Get repository content for scanning.
      - name: Checkout repository
        uses: actions/checkout@v5

      # Reporting scan: generate SARIF for GitHub code scanning.
      - name: Run Trivy filesystem reporting scan (SARIF)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          cache: "false"
          ignore-unfixed: true
          exit-code: "0"

      # Upload SARIF even if findings exist.
      - name: Upload filesystem SARIF
        if: always() && env.TRIVY_UPLOAD_SARIF == 'true' && hashFiles('trivy-fs-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      # Gating scan: fail only on HIGH/CRITICAL vulnerabilities.
      - name: Run Trivy filesystem gating scan (table)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          cache: "false"
          ignore-unfixed: true
          exit-code: "1"

  build-and-scan-image:
    name: Build And Scan Docker Image
    runs-on: ubuntu-latest

    steps:
      # Get repository content for image build and scan.
      - name: Checkout repository
        uses: actions/checkout@v5

      # Build a Docker image tagged with the current commit SHA.
      - name: Build Docker image
        run: |
          IMAGE_REF="fairplayr:${GITHUB_SHA}"
          if [ -f Dockerfile ]; then
            docker build --tag "${IMAGE_REF}" .
          else
            cat > Dockerfile.trivy <<'EOF'
            FROM alpine:3.20
            WORKDIR /workspace
            COPY . .
            EOF
            docker build -f Dockerfile.trivy --tag "${IMAGE_REF}" .
          fi

      # Export image to tar so Trivy scan does not depend on local daemon lookup behavior.
      - name: Export Docker image tarball
        run: docker save "fairplayr:${GITHUB_SHA}" -o fairplayr-image.tar

      # Reporting scan: generate SARIF for GitHub code scanning.
      - name: Run Trivy image reporting scan (SARIF)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: docker-archive:fairplayr-image.tar
          format: sarif
          output: trivy-image-results.sarif
          cache: "false"
          ignore-unfixed: true
          exit-code: "0"

      # Upload SARIF even if findings exist.
      - name: Upload image SARIF
        if: always() && env.TRIVY_UPLOAD_SARIF == 'true' && hashFiles('trivy-image-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      # Gating scan: fail only on HIGH/CRITICAL vulnerabilities.
      - name: Run Trivy image gating scan (table)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: docker-archive:fairplayr-image.tar
          format: table
          severity: HIGH,CRITICAL
          cache: "false"
          ignore-unfixed: true
          exit-code: "1"
